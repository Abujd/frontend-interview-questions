<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Meme</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .meme {
            width: 420px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            line-height: 1.6;
        }

        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .highlight {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="meme">
        <div class="emoji">📦</div>

        <div>
            Array: <span class="highlight">"I keep everything in order."</span>
            <br />
            Developer: <span class="highlight">"Until I change the index." 😂</span>
        </div>
    </div>
    <script type="module" src="./spiralOrder.js"></script>
</body>

</html>
