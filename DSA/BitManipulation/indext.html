    <h1>Bit Manipulation</h1>

    <p>Basic bitwise operations used in DSA:</p>

    <ul>
        <li><b>AND (&)</b> - 1 if both bits are 1</li>
        <li><b>OR (|)</b> - 1 if at least one bit is 1</li>
        <li><b>XOR (^)</b> - 1 if bits are different</li>
        <li><b>NOT (~)</b> - Flips the bits</li>
        <li><b>Left Shift (&lt;&lt;)</b> - Shifts bits to the left</li>
        <li><b>Right Shift (&gt;&gt;)</b> - Shifts bits to the right</li>
    </ul>
