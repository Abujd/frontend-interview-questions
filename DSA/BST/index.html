<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BST</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0d1117;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        .meme {
            width: 600px;
            padding: 45px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .code {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            font-family: "Courier New", monospace;
            font-size: 24px;
            color: #58a6ff;
            margin-bottom: 35px;
        }

        .me {
            font-size: 26px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .arrow {
            font-size: 50px;
            margin: 20px 0;
        }

        .question {
            font-size: 22px;
            color: #8b949e;
            margin-bottom: 10px;
        }

        .punchline {
            font-size: 34px;
            font-weight: bold;
            margin-top: 15px;
        }

        .subtext {
            margin-top: 15px;
            font-size: 18px;
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="meme">

        <div class="header">
            🌳 BST
        </div>

        <div class="me">
            <strong>Me:</strong><br />
            "BST is easy."
        </div>

        <div class="code">
            Left &lt; Root &lt; Right
        </div>

        <div class="question">
            BST after one wrong insertion:
        </div>

        <div class="arrow">
            🌳 ➡️ 📈
        </div>

        <div class="punchline">
            Linked List 💀
        </div>

        <div class="subtext">
            "Balanced? Never heard of her."
        </div>

    </div>
    <script type="module" src="./maxSumBST.js"></script>

</body>

</html>
